<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file: https://mdreader.local; style-src 'self' file: https://mdreader.local 'unsafe-inline'; img-src 'self' file: data: https://mdreader.local;">
<title>MDReader</title>
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="start.css">
</head>
<body class="start">
<main class="start-shell">
  <section class="hero">
    <img class="logo" src="appicon.png" alt="" width="104" height="104">
    <h1>MDReader</h1>
    <p class="tagline" id="tagline">轻量的 Markdown 阅读器</p>
    <p class="version" id="version"></p>
    <div class="actions">
      <button class="action" id="act-open">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M2.8 5.2c0-.9.7-1.6 1.6-1.6h3.4l1.6 1.8h6.2c.9 0 1.6.7 1.6 1.6v7.4c0 .9-.7 1.6-1.6 1.6H4.4c-.9 0-1.6-.7-1.6-1.6z"/></svg>
        <span class="label" id="lbl-open">打开文件…</span><kbd>⌘O</kbd>
      </button>
      <button class="action" id="act-new">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M5 2.8h6.4l3.6 3.6v10a.8.8 0 0 1-.8.8H5a.8.8 0 0 1-.8-.8V3.6c0-.4.4-.8.8-.8zM11 3v3.8h3.8M10 9.4v5M7.5 11.9h5"/></svg>
        <span class="label" id="lbl-new">新建文档</span><kbd>⌘N</kbd>
      </button>
    </div>
    <p class="drop-hint" id="drop-hint">也可以把 .md 文件拖到这里</p>
  </section>

  <section class="recents">
    <div class="recents-head">
      <h2 id="lbl-recent">最近打开</h2>
      <button class="clear" id="act-clear">清除</button>
    </div>
    <div class="recent-list" id="recent-list"></div>
  </section>
</main>
<div class="drop-overlay" id="drop-overlay"><div class="drop-card" id="drop-card">松开以打开</div></div>
<script src="start.js"></script>
</body>
</html>
