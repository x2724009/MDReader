name: MDReader
options:
  bundleIdPrefix: io.github.x2724009
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    ASSETCATALOG_COMPILER_APPICON_NAME: ""

targets:
  MDReader:
    type: application
    platform: macOS
    sources:
      - path: mac/App
      - path: mac/Shared
      - path: mac/Resources
      - path: shared/web
        type: folder
        buildPhase: resources
    dependencies:
      - target: MDReaderThumbnail
      - target: MDReaderPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.x2724009.mdreader
        PRODUCT_NAME: MDReader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: mac/App/Info.plist
      properties:
        CFBundleDisplayName: MDReader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "MDReader"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: MarkdownDoc
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeIconFile: MarkdownDoc
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn, mdwn, mdtxt, mdtext]
              public.mime-type: [text/markdown, text/x-markdown]

  MDReaderThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: mac/Thumbnail
      - path: mac/Shared
    dependencies:
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.x2724009.mdreader.thumbnail
        PRODUCT_NAME: MDReaderThumbnail
        SKIP_INSTALL: YES
    entitlements:
      path: mac/Thumbnail/Thumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: mac/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: MDReader Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLThumbnailMinimumDimension: 0

  MDReaderPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: mac/Preview
      - path: mac/Shared/TextDecoding.swift
      - path: shared/web
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: QuickLookUI.framework
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.x2724009.mdreader.preview
        PRODUCT_NAME: MDReaderPreview
        SKIP_INSTALL: YES
    entitlements:
      path: mac/Preview/Preview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: mac/Preview/Info.plist
      properties:
        CFBundleDisplayName: MDReader Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false
